name: Suggest a System Design Problem
description: Propose a new system to design
labels: ["problem-suggestion"]
body:

    type: textarea id: problem-description attributes: label: Problem Description description: Describe the system (e.g., "Design a ride-sharing app"). placeholder: "Example: Design a scalable ride-sharing service like Uber." validations: required: true
    type: textarea id: requirements attributes: label: Requirements description: List functional or non-functional needs (optional). placeholder: |
        Functional: Book rides, track drivers.
        Non-functional: Handle 10K rides/hour, 99.99% uptime. validations: required: false '@ -Encoding UTF8